services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos_dev}
    ports:
      - "5433:5432"
    volumes:
      - lifeos_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-lifeos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 4s
      timeout: 3s
      retries: 12

  translator:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,es,fr,de,it,pt,ja,ko,zh
      LT_DISABLE_WEB_UI: "true"
      LT_BATCH_LIMIT: "100"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - translation_models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /tmp/booting.flag && ./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 10m

  api:
    build: .
    command: ["npm", "run", "server"]
    environment:
      PORT: 4000
      LIFEOS_LOCAL_DEMO: ${LIFEOS_LOCAL_DEMO:-false}
      DATABASE_URL: postgresql://lifeos:${POSTGRES_PASSWORD:-lifeos_dev}@database:5432/lifeos
      TRANSLATION_SERVICE_URL: http://translator:5000/translate
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: "${EMAIL_FROM:-Life OS <no-reply@example.com>}"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY_ID: ${STRIPE_PRICE_MONTHLY_ID:-}
      STRIPE_PRICE_YEARLY_ID: ${STRIPE_PRICE_YEARLY_ID:-}
    depends_on:
      database:
        condition: service_healthy
      translator:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build: .
    command: ["npm", "run", "dev:web", "--", "--host", "0.0.0.0"]
    volumes:
      - ./src:/app/src
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  lifeos_data:
  translation_models:
